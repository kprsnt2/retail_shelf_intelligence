version: '3.8'

services:
  retail-shelf-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepwork-retail-intelligence
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ON_PREM_MODE=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
